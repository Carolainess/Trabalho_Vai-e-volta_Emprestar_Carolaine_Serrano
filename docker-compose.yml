# ============================================================
#  Sobe a aplicação + o PostgreSQL com um comando:
#      docker compose up --build
#  Depois acesse http://localhost:8080
# ============================================================
services:

  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaievolta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaievolta"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Padrao: "Host=banco;Port=5432;Database=vaievolta;Username=postgres;Password=postgres"
      TZ: America/Sao_Paulo
    expose:
      - "8080"
    depends_on:
      banco:
        condition: service_healthy
    volumes:
      - fotos:/app/wwwroot/uploads
      - chaves:/app/chaves
    restart: unless-stopped

volumes:
  dados-postgres:
  fotos:
  chaves:
